<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深刻認識一個人 | 200題終極多選版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .perspective { perspective: 1000px; }
        .card-flip { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .is-flipped { transform: rotateY(180deg); }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .bg-animate {
            background: linear-gradient(-45deg, #09090b, #111827, #064e3b, #022c22);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 毛玻璃質感 */
        .glass-panel {
            background: rgba(39, 39, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        /* 選取狀態的樣式 */
        .filter-active { background-color: #10b981; color: white; border-color: #10b981; box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39); }
        .filter-inactive { background-color: rgba(39, 39, 42, 0.8); color: #a1a1aa; border-color: #3f3f46; }
    </style>
</head>
<body class="bg-animate text-zinc-100 min-h-[100dvh] flex flex-col items-center justify-between overflow-hidden relative">

    <div class="w-full max-w-sm pt-6 px-6 flex flex-col gap-4 z-30">

        </div>

        <div class="flex justify-center gap-2">
            <button onclick="toggleDepth(1)" id="btn-depth-1" class="filter-active px-4 py-1.5 rounded-full text-xs font-bold transition-all border">🧊 淺 (破冰)</button>

        <div class="relative w-full">
            <button onclick="toggleCategoryMenu()" id="cat-trigger-btn" class="w-full py-2.5 rounded-xl text-sm font-bold glass-panel text-emerald-300 flex justify-between items-center px-4 active:scale-95 transition-all shadow-lg">
                <span class="flex items-center gap-2">📂 選擇類別</span>
                <span id="cat-status" class="text-xs bg-emerald-500 text-white px-2 py-0.5 rounded-full shadow-md">全部</span>

            <div id="cat-menu" class="hidden absolute top-full left-0 right-0 mt-2 p-4 glass-panel rounded-2xl shadow-2xl flex-col gap-3 max-h-[55vh] overflow-y-auto z-50">
                
                <div class="flex justify-between items-center mb-1 pb-3 border-b border-zinc-700/50 sticky top-0 bg-[#1c1c1e]/80 backdrop-blur-md pt-1 z-10 -mt-2 -mx-2 px-2">
                    <div class="flex gap-2">
                        <button onclick="selectAllCat()" class="text-xs bg-zinc-700 hover:bg-zinc-600 text-zinc-100 px-3 py-1.5 rounded-lg transition-colors font-bold">全選</button>
                        <button onclick="deselectAllCat()" class="text-xs bg-zinc-800 border border-zinc-600 text-zinc-300 hover:bg-zinc-700 px-3 py-1.5 rounded-lg transition-colors font-bold">全清</button>
                    </div>
                    <button onclick="toggleCategoryMenu()" class="text-emerald-400 text-sm font-bold bg-emerald-500/20 px-4 py-1.5 rounded-lg active:scale-95 transition-all">完成</button>
                </div>

                <div id="category-grid" class="grid grid-cols-2 gap-2 mt-1">
                    </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-sm flex flex-col items-center flex-1 justify-center px-6 z-10 relative mt-2">
        <div id="menu-backdrop" onclick="toggleCategoryMenu()" class="hidden fixed inset-0 z-40"></div>

        <div id="card-tags" class="mb-4 flex gap-2 opacity-0 transition-all">

        </div>

        <div id="card-container" class="perspective w-full aspect-[3/4] cursor-pointer">

                <div class="backface-hidden absolute inset-0 bg-zinc-800/80 border-2 border-zinc-700 rounded-3xl flex flex-col items-center justify-center p-8 text-center backdrop-blur-sm">
                    <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center mb-6">

                    </div>

                </div>

    </div>

    <div class="w-full max-w-sm mb-10 pb-2 px-6 space-y-4 z-20">

            抽一張
        </button>
    </div>

                filterGrid.appendChild(btn);
            });

            selectedCategories = new Set(categories);
            updateFilterUI();
            buildDeck();

        function deselectAllCat() {
            selectedCategories.clear();
            updateFilterUI();
            buildDeck();
        }

        function toggleDepth(depth) {
            if (selectedDepths.has(depth)) {
                if (selectedDepths.size > 1) {
                    selectedDepths.delete(depth);
                } else {
                    return; 
                }
            } else {
                selectedDepths.add(depth);
            }
            updateFilterUI();
            buildDeck();
        }

        function toggleCategory(cat) {
            if (selectedCategories.has(cat)) {
                selectedCategories.delete(cat);
            } else {
                selectedCategories.add(cat);
            }
            updateFilterUI();
            buildDeck();
        }

        function updateFilterUI() {
            [1, 2, 3].forEach(d => {
                const btn = document.getElementById(`btn-depth-${d}`);
                btn.className = selectedDepths.has(d) 
                    ? "filter-active px-4 py-1.5 rounded-full text-xs font-bold transition-all border"
                    : "filter-inactive px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-zinc-600";
            });

            const statusBadge = document.getElementById('cat-status');

            if (selectedCategories.size === categories.length) {
                statusBadge.innerText = "全部";
            } else if (selectedCategories.size === 0) {
                statusBadge.innerText = "無";
            } else {
                statusBadge.innerText = `已選 ${selectedCategories.size} 項`;
            }

            categories.forEach(cat => {
                const btn = document.getElementById(`btn-cat-${cat}`);
                btn.className = selectedCategories.has(cat)
                    ? "w-full px-2 py-2 rounded-xl text-xs font-bold transition-all filter-active"
                    : "w-full px-2 py-2 rounded-xl text-xs font-bold transition-all filter-inactive";
            });
        }

        function buildDeck() {
            let pool = allQuestions.filter(q => {
                const depthMatch = selectedDepths.has(q.depth);
                const catMatch = selectedCategories.has(q.cat);
                return depthMatch && catMatch;
            });
            
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            deck = pool;
            
            resetCardUI();
            updateCounter();
        }

            let depthColor = "";
            if(q.depth === 1) { depthStr = "🧊 淺"; depthColor = "text-blue-400 border-blue-400/50 bg-blue-400/10"; }
            else if(q.depth === 2) { depthStr = "☕ 中"; depthColor = "text-amber-400 border-amber-400/50 bg-amber-400/10"; }
            else { depthStr = "🍷 深"; depthColor = "text-rose-400 border-rose-400/50 bg-rose-400/10"; }

            const updateContent = () => {
                questionText.innerText = q.text;
                categoryTag.innerText = q.cat;
                depthTag.innerText = depthStr;
                depthTag.className = `px-3 py-1 border rounded-full text-[10px] font-bold tracking-widest transition-all ${depthColor}`;
                cardTags.style.opacity = "1";
            };
            
            if (cardInner.classList.contains('is-flipped')) {
                cardInner.classList.remove('is-flipped');
                setTimeout(() => {
                    updateContent();
                    cardInner.classList.add('is-flipped');
                    updateCounter();
                }, 300);
            } else {
                updateContent();
                cardInner.classList.add('is-flipped');
                updateCounter();
            }
        }

        function updateCounter() {
            document.getElementById('counter').innerText = `目前牌組剩餘 ${deck.length} 題`;
        }

        // 初始化執行
        initCategoryFilters();
        updateFilterUI();
        buildDeck();
        document.getElementById('card-container').addEventListener('click', drawCard);
    </script>
</body>
</html>
